<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Система обліку студентів</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Іконки Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body>
    <!-- Шапка сайту -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="#">Система обліку студентів</a>
        
        <!-- Блок авторизації у навігації -->
        <div id="auth-nav-block">
            <span id="user-greeting" class="text-white me-3 d-none"></span>
            <button class="btn btn-outline-light d-none" id="logout-btn">Вийти</button>
            <button class="btn btn-light" id="login-btn-nav" data-bs-toggle="modal" data-bs-target="#authModal">Увійти</button>
        </div>
      </div>
    </nav>

    <!-- Основний контейнер -->
    <div class="container py-4" id="main-app-content" style="display: none;">
      <!-- Заголовок + кнопки -->
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="h3">Список таблиць практики</h1>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-primary btn-add" data-bs-toggle="modal" data-bs-target="#tableModal">
            <i class="bi bi-plus-lg"></i> Створити таблицю
          </button>

          <!-- Імпорт самої таблиці -->
          <input type="file" id="container__file-input" class="d-none" accept=".csv,.xlsx,.xls" />
          <button class="btn btn-secondary" id="container__file-import">
            <i class="bi bi-table"></i> Імпорт таблиці
          </button>

          <!-- Імпорт довідника студентів -->
          <input type="file" id="dict-file-input" class="d-none" accept=".csv,.xlsx,.xls" />
          <button class="btn btn-info text-white" onclick="document.getElementById('dict-file-input').click()">
            <i class="bi bi-people-fill"></i> Довідник студентів
          </button>
        </div>
      </div>

      <!-- Таблиця -->
      <div class="table-container shadow-sm bg-white rounded p-2">
        <table class="table table-hover align-middle" id="meta__table">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Назва таблиці</th>
              <th>Факультет</th>
              <th>Код Спеціальності</th>
              <th>Дата створення</th>
              <th>Дата зміни</th>
              <th>Дії</th>
            </tr>
          </thead>
          <tbody id="tables-list"></tbody>
        </table>
      </div>

      <!-- Пагінація -->
      <nav class="mt-3" id="pagination-nav" style="display: none;">
        <ul class="pagination justify-content-center" id="pagination">
        </ul>
      </nav>
    </div>

    <!-- Модальне вікно Авторизації -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Авторизація</h5>
            </div>
            <div class="modal-body">
              <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login-tab">Вхід</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" data-bs-toggle="tab" data-bs-target="#register-tab">Реєстрація</button>
                </li>
              </ul>
              <div class="tab-content">
                <!-- Вхід -->
                <div class="tab-pane fade show active" id="login-tab">
                  <form id="loginForm">
                    <div class="mb-3">
                      <label class="form-label">Email</label>
                      <input type="email" id="loginEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Пароль</label>
                      <input type="password" id="loginPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Увійти</button>
                  </form>
                </div>
                <!-- Реєстрація -->
                <div class="tab-pane fade" id="register-tab">
                  <form id="registerForm">
                    <div class="mb-3">
                      <label class="form-label">ПІБ</label>
                      <input type="text" id="regName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Email</label>
                      <input type="email" id="regEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Пароль</label>
                      <input type="password" id="regPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Зареєструватися</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    <!-- Модальне вікно Створення таблиці (Існуюче) -->
    <div class="modal fade" id="tableModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form>
            <div class="modal-header">
              <h5 class="modal-title" id="tableModalLabel">Додати / Редагувати таблицю</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-12">
                  <label class="form-label" for="form__table-name">Системна назва таблиці (англ. літерами, напр. practice_2026)</label>
                  <input type="text" class="form-control" id="form__table-name" required />
                </div>
                <div class="col-md-12">
                  <label class="form-label" for="form__description">Опис (Назва для відображення)</label>
                  <input type="text" class="form-control" id="form__description" placeholder="Наприклад: Виробнича практика ПІ-22" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Факультет</label>
                  <input type="text" class="form-control" id="form__faculty-name" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Код спеціальності</label>
                  <input type="text" class="form-control" id="form__specialty-code" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Назва кафедри</label>
                  <input type="text" class="form-control" id="form__department-name" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Кількість груп</label>
                  <input type="number" class="form-control" id="form__group-count" min="1" max="15" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Рік вступу</label>
                  <input type="number" class="form-control" id="form__entry-year" min="2000" max="2200" required />
                </div>
                <input type="hidden" id="form__table-id" />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
              <button type="submit" class="btn btn-primary">Зберегти</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- СКРИПТ АВТОРИЗАЦІЇ ТА JWT ПЕРЕХОПЛЕННЯ -->
    <script>
        // Глобальний перехоплювач fetch, щоб автоматично додавати токен до всіх ваших існуючих запитів у index.js
        const originalFetch = window.fetch;
        window.fetch = async function(resource, config = {}) {
            const token = localStorage.getItem('jwt_token');
            
            // Додаємо токен, якщо він є і це запит на наш API
            if(token && typeof resource === 'string'
               && (resource.includes('/api/')
               || resource.includes('/upload') || resource.includes('/create-table')) &&
              !resource.includes('/auth/')) {
                
                config.headers = config.headers || {};
                // Якщо FormData, не встановлюємо Content-Type руками, але додаємо Authorization
                if(config.headers instanceof Headers) {
                  config.headers.set(['Authorization'], `Bearer ${token}`);
                }else {
                  config.headers['Authorization'] = `Bearer ${token}`;
                }
            }
            
            const response = await originalFetch(resource, config);
            
            // Якщо сервер каже, що токен прострочений або відсутній
            if(response.status === 401 && typeof resource === 'string' && !resource.includes('/auth/')) {
                localStorage.removeItem('jwt_token');
                if(typeof checkAuth === "function") {
                  checkAuth();
                }
            }
            return response;
        };

        // Логіка інтерфейсу
        let authModalInstance;
        
        document.addEventListener('DOMContentLoaded', () => {
            authModalInstance = new bootstrap.Modal(document.getElementById('authModal'));
            checkAuth();

            // Обробка імпорту довідника студентів
            document.getElementById('dict-file-input').addEventListener('change', async (e) => {
                if(!e.target.files[0]) return;
                const formData = new FormData();
                formData.append('file', e.target.files[0]);
                
                try {
                    const res = await fetch('/api/students/import-dictionary', { method: 'POST', body: formData });
                    const data = await res.json();
                    alert(data.message || data.error);
                } catch (err) { alert('Помилка завантаження'); }
                e.target.value = ''; // Очищуємо input
            });
        });

        function checkAuth() {
            const token = localStorage.getItem('jwt_token');
            const name = localStorage.getItem('user_name');
            if (token) {
                document.getElementById('main-app-content').style.display = 'block';
                document.getElementById('login-btn-nav').classList.add('d-none');
                document.getElementById('logout-btn').classList.remove('d-none');
                document.getElementById('user-greeting').classList.remove('d-none');
                document.getElementById('user-greeting').innerText = `Вітаємо, ${name}`;
                authModalInstance.hide();
            } else {
                document.getElementById('main-app-content').style.display = 'none';
                document.getElementById('login-btn-nav').classList.remove('d-none');
                document.getElementById('logout-btn').classList.add('d-none');
                document.getElementById('user-greeting').classList.add('d-none');
                authModalInstance.show();
            }
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('user_name');
            checkAuth();
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                })
            });
            const data = await res.json();
            if(res.ok) {
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('user_name', data.full_name);
                checkAuth();
                window.location.reload(); // Перезавантажуємо, щоб запрацював ваш index.js
            } else { alert(data.error); }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    full_name: document.getElementById('regName').value,
                    email: document.getElementById('regEmail').value,
                    password: document.getElementById('regPassword').value,
                    role: 'teacher'
                })
            });
            const data = await res.json();
            if(res.ok) {
                alert('Реєстрація успішна! Тепер увійдіть.');
                document.querySelector('[data-bs-target="#login-tab"]').click();
            } else { alert(data.error); }
        });
    </script>

    <!-- Ваш JS для обробки форми -->
    <script src="../../JS/index.js"></script>
  </body>
</html>
