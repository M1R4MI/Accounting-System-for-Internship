<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Виробнича практика</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Іконки Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-light">
    
    <!-- Навігація для повернення і виходу -->
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a href="/" class="btn btn-outline-light me-2"><i class="bi bi-arrow-left"></i> На головну</a>
        <span class="navbar-brand mb-0 h1" id="page-title">Супровід практики</span>
        <button class="btn btn-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Вийти</button>
      </div>
    </nav>

    <div class="container-fluid px-4 py-2">
      <!-- Панель інструментів -->
      <div class="d-flex flex-wrap justify-content-between mb-3 gap-2">
        <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">
            <i class="bi bi-plus-lg"></i> Додати запис
            </button>

            <!-- Пошук -->
            <div class="input-group" style="width: 250px;">
                <input type="text" id="searchInput" class="form-control" placeholder="Пошук..." />
                <button class="btn btn-primary" onclick="searchInTable()"><i class="bi bi-search"></i></button>
            </div>

            <!-- Фільтри -->
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-funnel"></i> Сортування
                </button>
                <ul class="dropdown-menu">
                    <li><button class="dropdown-item" onclick="sortBy('StudentName')">За іменем</button></li>
                    <li><button class="dropdown-item" onclick="sortBy('StudentGroup')">За групою</button></li>
                    <li><button class="dropdown-item" onclick="sortBy('RegistrationDate')">За датою</button></li>
                </ul>
            </div>
        </div>

        <div class="d-flex gap-2">
            <!-- Експорт Excel -->
            <button class="btn btn-outline-success" id="exportBtn">
                <i class="bi bi-file-earmark-excel"></i> Excel
            </button>
            <!-- Новий Експорт PDF -->
            <button class="btn btn-outline-danger" id="exportPdfBtn" onclick="exportPdf()">
                <i class="bi bi-file-earmark-pdf"></i> PDF
            </button>
        </div>
      </div>

      <!-- Таблиця -->
      <div class="table-responsive shadow-sm bg-white p-3 rounded">
        <table class="table table-hover align-middle table-bordered" id="dataTable">
          <thead class="table-dark">
            <tr>
              <th>№</th>
              <th>Реєстр. номер</th>
              <th>Дата реєстрації</th>
              <th>ПІБ студента</th>
              <th>Група</th>
              <th>Місце практики</th>
              <th>Контактна особа</th>
              <th>Вид документу</th>
              <th>Статус підписання</th>
              <th>Інструктаж з ОП</th>
              <th class="text-center">Документи</th> <!-- Нова колонка -->
              <th>Дії</th>
            </tr>
          </thead>
          <tbody>
            <!-- Динамічно генерується JS -->
            <!-- ПРИКЛАД ТОГО ЯК МАЄ ВИГЛЯДАТИ КНОПКА ДОКУМЕНТІВ В JS ГЕНЕРАЦІЇ:
                 <td><button class="btn btn-sm btn-info" onclick="openDocsModal(${row.id})"><i class="bi bi-folder2-open"></i> Файли</button></td> 
            -->
          </tbody>
        </table>
      </div>

      <nav class="mt-3">
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>
    </div>

    <!-- Модальне вікно додавання -->
    <div class="modal fade" id="addModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="addForm">
          <div class="modal-header">
            <h5 class="modal-title">Додати запис</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body row g-3">
            <div class="col-md-6">
              <label class="form-label">ПІБ студента</label>
              <!-- Можна змінити на select для вибору з довідника у майбутньому -->
              <input type="text" id="nameField" class="form-control" required list="students-datalist"/>
              <datalist id="students-datalist"></datalist>
            </div>
            <div class="col-md-6">
              <label class="form-label">Група</label>
              <select id="group" class="form-select" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Дата реєстрації</label>
              <input type="date" id="registrationDate" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Місце практики</label>
              <input type="text" id="information" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Контактна особа</label>
              <input type="text" id="contact" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Стан підписання угоди</label>
              <select id="signingStatus" class="form-select" required>
                <option value="">Оберіть</option>
                <option value="Підписано">Підписано</option>
                <option value="Відхилено">Відхилено</option>
                <option value="В обробці">В обробці</option>
                <option value="Доопрацювати">Доопрацювати</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Вид документу</label>
              <select id="documentType" class="form-select" required>
                <option value="">Оберіть</option>
                <option value="Угода">Угода</option>
                <option value="Заява">Заява</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Інструктаж з ОП</label>
              <select id="op" class="form-select" required>
                <option value="">Оберіть</option>
                <option value="Пройшов(-ла)">Пройшов(-ла)</option>
                <option value="Не пройшов(-ла)">Не пройшов(-ла)</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Додати</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрити</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Існуюче вікно редагування... -->
    <!-- (Збережено без змін, щоб не ламати ваш код, окрім ідентифікаторів) -->

    <!-- НОВЕ: Модальне вікно для роботи з файлами (Звіти, Щоденники) -->
    <div class="modal fade" id="docsModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header bg-info text-white">
              <h5 class="modal-title"><i class="bi bi-folder"></i> Документи студента</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="docRowId">
              
              <!-- Форма завантаження -->
              <div class="card mb-3">
                  <div class="card-body">
                      <h6>Завантажити новий документ</h6>
                      <form id="uploadDocForm" class="d-flex flex-column gap-2">
                          <select id="uploadDocType" class="form-select form-select-sm" required>
                              <option value="Звіт">Звіт з практики</option>
                              <option value="Щоденник">Щоденник</option>
                              <option value="Скан угоди">Скан угоди</option>
                          </select>
                          <input type="file" id="uploadFile" class="form-control form-control-sm" required>
                          <button type="submit" class="btn btn-primary btn-sm">Завантажити на сервер</button>
                      </form>
                  </div>
              </div>

              <!-- Список файлів -->
              <h6>Завантажені файли:</h6>
              <ul class="list-group" id="uploadedDocsList">
                  <!-- JS рендерить сюди файли -->
              </ul>
            </div>
          </div>
        </div>
      </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- СКРИПТ АВТОРИЗАЦІЇ ТА PDF -->
    <script>
        const tableName = window.location.pathname.split('/').pop() || new URLSearchParams(window.location.search).get('table');

        // Глобальний перехоплювач fetch (такий самий як в index.html)
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            const token = localStorage.getItem('jwt_token');
            if(!token) {
                window.location.href = '/'; // Якщо немає токена, викидаємо на головну
                return;
            }
            if(resource.includes('/api/') || resource.includes('/upload')) {
                config = config || {};
                config.headers = config.headers || {};
                // Якщо FormData, браузер сам поставить multipart/form-data з boundary
                if (!(config.body instanceof FormData)) {
                    config.headers['Content-Type'] = config.headers['Content-Type'] || 'application/json';
                }
                config.headers['Authorization'] = `Bearer ${token}`;
            }
            const response = await originalFetch(resource, config);
            if(response.status === 401 || response.status === 403) {
                localStorage.removeItem('jwt_token');
                window.location.href = '/';
            }
            return response;
        };

        function logout() {
            localStorage.removeItem('jwt_token');
            window.location.href = '/';
        }

        // Експорт в PDF
        function exportPdf() {
            const token = localStorage.getItem('jwt_token');
            // Оскільки завантаження файлу через window.open або <a> не передає Headers, 
            // використовуємо fetch для завантаження Blob
            fetch(`/api/table/${tableName}/export-pdf`)
            .then(res => res.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${tableName}_звіт.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            });
        }

        // Логіка для модального вікна файлів
        const docsModal = new bootstrap.Modal(document.getElementById('docsModal'));
        
        // ВАЖЛИВО: Викличте цю функцію з вашого table.js у рендері рядків!
        // Наприклад, додайте кнопку: 
        // <button onclick="openDocsModal(${row.ID})" class="btn btn-sm btn-info">Файли</button>
        window.openDocsModal = async function(rowId) {
            document.getElementById('docRowId').value = rowId;
            await loadDocuments(rowId);
            docsModal.show();
        }

        async function loadDocuments(rowId) {
            const list = document.getElementById('uploadedDocsList');
            list.innerHTML = '<li class="list-group-item text-center">Завантаження...</li>';
            try {
                const res = await fetch(`/api/documents/${tableName}/${rowId}`);
                const docs = await res.json();
                list.innerHTML = '';
                if(docs.length === 0) {
                    list.innerHTML = '<li class="list-group-item text-muted">Немає завантажених файлів</li>';
                    return;
                }
                docs.forEach(doc => {
                    list.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <span class="badge bg-secondary me-2">${doc.document_type}</span>
                                <a href="${doc.file_path}" target="_blank">${doc.original_name}</a>
                            </div>
                        </li>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        document.getElementById('uploadDocForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('table_name', tableName);
            formData.append('row_id', document.getElementById('docRowId').value);
            formData.append('document_type', document.getElementById('uploadDocType').value);
            formData.append('document', document.getElementById('uploadFile').files[0]);

            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = 'Завантаження...';

            try {
                // Fetch автоматично підставить Authorization через наш перехоплювач
                const res = await fetch('/api/documents/upload', { method: 'POST', body: formData });
                if(res.ok) {
                    alert('Файл успішно завантажено');
                    e.target.reset();
                    loadDocuments(document.getElementById('docRowId').value);
                } else {
                    const err = await res.json();
                    alert(err.error || 'Помилка');
                }
            } catch (err) { alert('Помилка сервера'); }
            finally {
                btn.disabled = false;
                btn.innerText = 'Завантажити на сервер';
            }
        });

        // Завантаження довідника студентів для datalist
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/students/dictionary');
                if(res.ok) {
                    const students = await res.json();
                    const datalist = document.getElementById('students-datalist');
                    students.forEach(s => {
                        datalist.innerHTML += `<option value="${s.full_name}"></option>`;
                    });
                }
            } catch(e) {}
        });
    </script>

    <!-- Ваш JS -->
    <script src="../../JS/table.js"></script>
  </body>
</html>
