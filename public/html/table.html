<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Система обліку студентів для проходження виробничої практики</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Іконки Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <!-- Кастомні стилі -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <!-- Заголовок -->
      <h1 class="mb-4 text-center fw-bold">
        Система обліку студентів для проходження виробничої практики
      </h1>

      <!-- Панель інструментів -->
      <div class="d-flex flex-wrap gap-2 mb-3">
        <!-- Кнопка додавання -->
        <button
          class="btn btn-success"
          data-bs-toggle="modal"
          data-bs-target="#addModal"
        >
          <i class="bi bi-plus-lg"></i> Додати
        </button>

        <!-- Пошук -->
        <div class="input-group h-75">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Пошук..."
          />
          <button class="btn btn-primary h-75" onclick="searchInTable()">
            <i class="bi bi-search"></i>
          </button>
        </div>

        <!-- Фільтри -->
        <div class="dropdown">
          <button
            class="btn btn-outline-secondary dropdown-toggle"
            type="button"
            T-bs-toggle="dropdown"
          >
            <i class="bi bi-funnel"></i> Фільтр
          </button>
          <ul class="dropdown-menu">
            <li>
              <button class="dropdown-item" onclick="sortBy('name')">
                За іменем
              </button>
            </li>
            <li>
              <button class="dropdown-item" onclick="sortBy('studentGroup')">
                За групою
              </button>
            </li>
            <li>
              <button
                class="dropdown-item"
                onclick="sortBy('registrationDate')"
              >
                За датою
              </button>
            </li>
          </ul>
        </div>

        <!-- Експорт -->
        <button
          class="btn btn-outline-dark"
          onclick="exportTable('mainDataTable')"
        >
          <i class="bi bi-download"></i> Експорт
        </button>
      </div>

      <!-- Таблиця -->
      <div class="table-responsive shadow-sm bg-white p-3 rounded">
        <table class="table table-hover align-middle" id="dataTable">
          <thead class="table-dark">
            <tr>
              <th>№</th>
              <th>Реєстр. номер</th>
              <th>Дата реєстрації</th>
              <th>ПІБ студента</th>
              <th>Група</th>
              <th>Місце практики</th>
              <th>Контактна особа</th>
              <th>Вид документу</th>
              <th>Статус підписання</th>
              <th>Інструктаж з ОП</th>
              <th>Дії</th>
            </tr>
          </thead>
          <tbody>
            <!-- Динамічно генерується JS -->
          </tbody>
        </table>
      </div>

      <!-- Пагінація -->
      <nav class="mt-3">
        <ul class="pagination justify-content-center" id="pagination">
          <!-- Динамічно -->
        </ul>
      </nav>
    </div>

    <!-- Модальне вікно додавання -->
    <div class="modal fade" id="addModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="addForm">
          <div class="modal-header">
            <h5 class="modal-title">Додати студента</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body row g-3">
            <div class="col-md-6">
              <label class="form-label">ПІБ студента</label>
              <input type="text" id="nameField" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Група</label>
              <select id="group" class="form-select" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Дата реєстрації</label>
              <input
                type="date"
                id="registrationDate"
                class="form-control"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label">Місце практики</label>
              <input type="text" id="information" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Контактна особа</label>
              <input type="text" id="contact" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Стан підписання угоди</label>
              <select id="signingStatus" class="form-select" required>
                <option value="">Оберіть</option>
                <option value="Підписано">Підписано</option>
                <option value="Відхилено">Відхилено</option>
                <option value="В обробці">В обробці</option>
                <option value="Доопрацювати">Доопрацювати</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Вид документу</label>
              <select id="documentType" class="form-select" required>
                <option value="">Оберіть</option>
                <option value="Угода">Угода</option>
                <option value="Заява">Заява</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Інструктаж з ОП</label>
              <select id="op" class="form-select" required>
                <option value="">Оберіть</option>
                <option value="Пройшов(-ла)">Пройшов(-ла)</option>
                <option value="Не пройшов(-ла)">Не пройшов(-ла)</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Додати</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Закрити
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Ваш JS -->
    <script src="/JS/table.js"></script>
  </body>
</html>
