version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: accounting-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - accounting-network

  app:
    build: ./app
    container_name: accounting-app
    restart: always
    ports:
      - "${APP_PORT}:3308"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_USER_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 3308
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - accounting-network

volumes:
  db_data:
    driver: local

networks:
  accounting-network:
    driver: bridge
